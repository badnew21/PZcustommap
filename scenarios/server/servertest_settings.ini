# Soldiers Left Behind: the lines to change in your server's ini file
# (Zomboid/Server/<server name>.ini, servertest.ini by default).
# Leave everything else in the file as it is.

# Build 42 wants a backslash in front of each mod ID.
# On a Build 41 server use Mods=SoldiersLeftBehind instead.
Mods=\SoldiersLeftBehind

# Not on the Workshop: copy the mod folder into Zomboid/mods/ on the server
# and on each player's PC. Leave this empty unless you use other Workshop mods.
WorkshopItems=

# The normal Knox County map.
Map=Muldraugh, KY

# Every player starts at the Muldraugh police station. The mod then moves
# each new character onto a clear tile inside the building.
SpawnPoint=10638,10420,0

# Three of you, password protected.
MaxPlayers=4
Public=false
Password=changeme
Open=true

# You share one base, so no PvP.
PVP=false
SafetySystem=true

